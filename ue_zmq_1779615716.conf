[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 30.72e6 # RF sample rate in Hz, matching gNB.
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=30.72e6 # ZMQ ports for UE TX (2001) and RX (2000), crossed with gNB. Base sample rate for 20MHz, 15kHz SCS.

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 78 # NR band, matching gNB.
nof_carriers = 1

max_nof_prb = 106 # Max number of PRBs for 20MHz bandwidth, 15kHz SCS.
nof_prb = 106     # Number of PRBs to use.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc   = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 315010000000001 # IMSI with MCC 315, MNC 010, matching gNB PLMN.
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false