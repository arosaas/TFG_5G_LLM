cu_cp:
  amf:
    addr: 10.53.1.2               # La dirección IP del AMF del Core 5G.
    port: 38412
    bind_addr: 10.53.1.10           # La IP local que el gNB usa para el tráfico del AMF (debe coincidir con la IP del contenedor gNB).
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200            # Temporizador de inactividad para UE/Sesión PDU/DRB.
cu_up:
  ip: 10.53.1.10                    # La IP del CU-UP (debe coincidir con la IP del contenedor gNB para GTP-U).

ru_sdr:
  device_driver: zmq                # Driver RF ZMQ para simulación.
  device_args: tx_port=tcp://10.53.1.20:2000,rx_port=tcp://0.0.0.0:2001,base_srate=23.04e6 # CRÍTICO ZMQ: tx al UE, rx escucha en 0.0.0.0.
  srate: 23.04                      # Tasa de muestreo RF para 20 MHz de ancho de banda.
  tx_gain: 75                       # Ganancia de transmisión.
  rx_gain: 75                       # Ganancia de recepción.

cell_cfg:
  dl_arfcn: 620000                  # ARFCN para la banda n78 (3.5 GHz).
  band: 78                          # Banda NR n78 (3.5 GHz).
  channel_bandwidth_MHz: 20         # Ancho de banda de 20 MHz.
  common_scs: 15                    # Espaciado de subportadoras de 15 kHz.
  ssb_scs: 15                       # Espaciado de subportadoras del SSB, debe coincidir con common_scs.
  plmn: "00101"                     # PLMN broadcasted por el gNB.
  tac: 7                            # Tracking Area Code (debe coincidir con la configuración del Core).
  pdcch:
    common:
      ss0_index: 0                  # Índice de Search Space 0.
      coreset0_index: 12            # Índice de CORESET 0.
    dedicated:
      ss2_type: common              # Tipo de Search Space dedicado.
      dci_format_0_1_and_1_1: false # Formato DCI.
  prach:
    prach_config_index: 1           # Índice de configuración PRACH.
  pdsch:
    mcs_table: qam64                # Tabla MCS para PDSCH (64 QAM para baja latencia).
  pusch:
    mcs_table: qam64                # Tabla MCS para PUSCH (64 QAM para baja latencia).

log:
  filename: /tmp/gnb.log            # Ruta del archivo de log.
  all_level: info                   # Nivel de log para todas las capas.
  hex_max_size: 0

pcap:
  mac_enable: false                 # Deshabilitar PCAPs de capa MAC.
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false                # Deshabilitar PCAPs de NGAP.
  ngap_filename: /tmp/gnb_ngap.pcap
  e2ap_enable: false                # Deshabilitar PCAPs de E2AP.
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

metrics:
  layers:
    enable_rlc: true                # Habilitar métricas RLC.
    enable_sched: true              # Habilitar métricas del scheduler DU.
  periodicity:
    du_report_period: 1000          # Periodo de reporte de estadísticas DU (1 segundo).