[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6                     # Tasa de muestreo RF, debe coincidir con el gNB.
nof_antennas = 1

device_name = zmq                   # Driver RF ZMQ para simulación.
device_args = tx_port=tcp://10.53.1.10:2001,rx_port=tcp://0.0.0.0:2000,base_srate=23.04e6 # CRÍTICO ZMQ: tx al gNB, rx escucha en 0.0.0.0.

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 78                          # Banda NR n78, debe coincidir con el gNB.
nof_carriers = 1
max_nof_prb = 106                   # Número máximo de PRBs para 20 MHz, 15 kHz SCS.
nof_prb = 106                       # Número de PRBs para 20 MHz, 15 kHz SCS.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780             # IMSI con PLMN 00101, debe coincidir con el gNB y el Core.
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
# ip_addr = 10.45.0.2               # CRÍTICO: Omitir ip_addr para que el Core asigne la IP dinámicamente.
ip_netmask = 255.255.255.0

[gui]
enable = false