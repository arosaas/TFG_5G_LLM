services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    privileged: true
    ports:
      - "9898:9999/tcp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2} # IP fija del Core 5G.

  gnb:
    container_name: srsran_gnb
    image: srsran/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - gnb-storage:/tmp
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
    networks:
      ran:
        ipv4_address: ${GNB_IP:-10.53.1.10} # IP asignada al contenedor gNB.
      metrics:
        ipv4_address: 172.19.1.3
    depends_on:
      5gc:
        condition: service_healthy
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml

  ue:
    container_name: srsran_ue
    image: srsran/ue # Asumiendo una imagen srsran/ue disponible.
    build:
      context: ..
      dockerfile: docker/Dockerfile # Usar el mismo Dockerfile base y adaptar el comando.
      args:
        OS_VERSION: "24.04"
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - ue-storage:/tmp
    configs:
      - ue_config.conf
    networks:
      ran:
        ipv4_address: ${UE_IP:-10.53.1.20} # IP asignada al contenedor UE.
    depends_on:
      gnb:
        condition: service_started # El UE necesita que el gNB esté iniciado.
    command: ue -c /ue_config.conf

configs:
  gnb_config.yml:
    file: ./configs/gnb_config.yml # Ruta al archivo de configuración del gNB.
  gnb_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: ${OPEN5GS_IP:-10.53.1.2}
          bind_addr: ${GNB_IP:-10.53.1.10} # Debe coincidir con la IP del contenedor gNB.
      metrics:
        autostart_stdout_metrics: true
        enable_json: true
      remote_control:
        bind_addr: 0.0.0.0
        enabled: true
  ue_config.conf:
    file: ./configs/ue_config.conf # Ruta al archivo de configuración del UE.

volumes:
  gnb-storage:
  ue-storage:

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24 # Subred obligatoria para la red RAN.
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24