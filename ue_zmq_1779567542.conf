# ue_v2x.conf
#
# This configuration file sets up the srsRAN Project UE for V2X communications
# using ZeroMQ as the RF frontend, connecting to a gNB.
#
# To run the srsRAN Project UE with this config, use the following command:
#   sudo ./srsue -c ue_v2x.conf

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6                     # RF sample rate in Hz, matching gNB's 20MHz bandwidth.
nof_antennas = 1

device_name = zmq                   # RF driver name, using ZeroMQ for virtual RF.
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6 # ZMQ ports for UE (tx:2001, rx:2000), crossed with gNB.

[rat.eutra]
dl_earfcn = 2850                    # Not used for NR, but kept for template structure.
nof_carriers = 0

[rat.nr]
bands = 78                          # NR band, n78, matching gNB.
nof_carriers = 1

max_nof_prb = 106                   # Max number of PRBs for 20MHz bandwidth.
nof_prb = 106                       # Number of PRBs for 20MHz bandwidth.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft                         # USIM mode.
algo = milenage                     # USIM algorithm.
opc  = 63BFA50EE6523365FF14C1F45F88737D # Operator Code (OPc).
k    = 00112233445566778899aabbccddeeff # Subscriber Key (K).
imsi = 315010000000001              # International Mobile Subscriber Identity (IMSI).
                                    # MCC: 315, MNC: 010, MSIN: 000000001.

[rrc]
release = 15                        # 3GPP Release 15.
ue_category = 4                     # UE category.

[nas]
apn = srsapn                        # Access Point Name.
apn_protocol = ipv4                 # APN protocol.

[gw]
netns = ue1                         # Network namespace for the UE.
ip_devname = tun_srsue              # Tunnel device name.
ip_netmask = 255.255.255.0          # IP netmask.

[gui]
enable = false