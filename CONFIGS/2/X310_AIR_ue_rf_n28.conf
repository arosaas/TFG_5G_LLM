#Los valores de gain para la gNb en este setup fueron de Tx=70, Rx=30
[rf]
freq_offset = -3000
tx_gain = 20
rx_gain = 10
srate = 23.04e6
nof_antennas = 1

device_name = uhd
device_args = sync=internal
time_adv_nsamples = auto

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0
#dl_freq = 1842.5e6
#ul_freq = 1747.5e6

[rat.nr]
bands = 28
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106
dl_nr_arfcn = 154000
ssb_nr_arfcn = 152650

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = e734f8734007d6c5ce7a0508809e7e9c
k    = 8baf473f2f8fd09487cccbd7097c6862
imsi = 001010000000003
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
#netns = ue1
#ip_devname = tun_srsue
#ip_netmask = 255.255.255.0

[gui]
enable = true

