#Los valores de gain para la gNb en este setup fueron de Tx=70, Rx=30
#11/3/2025 quedó en 5Mhz de bW
[rf]
freq_offset = 500
tx_gain = 70	 	
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = uhd
device_args = sync=internal
#time_adv_nsamples = 40

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0
#dl_freq = 1842.5e6
#ul_freq = 1747.5e6

[rat.nr]
bands = 28
nof_carriers = 1
max_nof_prb = 25
nof_prb = 25
dl_nr_arfcn = 154000
ssb_nr_arfcn = 154090

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 504f20634f6320504f50206363500a4f
k    = 6874736969202073796d4b2079650a73
imsi = 001010000000001
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
#netns = ue1
#ip_devname = tun_srsue
#ip_netmask = 255.255.255.0

[gui]
enable = true

