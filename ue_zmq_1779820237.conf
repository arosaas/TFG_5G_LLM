# ue_lanparty.conf
# Configuración del UE para la LAN Party en la Universidad de Granada
# Coherente con el gNB para una conexión exitosa.

[rf]
freq_offset = 0
tx_gain = 50                        # Ganancia de transmisión del UE.
rx_gain = 40                        # Ganancia de recepción del UE.
srate = 23.04e6                     # Tasa de muestreo RF, coherente con gNB (20 MHz).
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6 # Puertos ZMQ inversos al gNB.

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3                           # Banda NR 3, coherente con gNB.
nof_carriers = 1

max_nof_prb = 106                   # Número máximo de PRBs para 20 MHz de ancho de banda.
nof_prb = 106                       # Número de PRBs en uso.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780             # IMSI con MCC "001" y MNC "01". Coherente con gNB y Core.
imei = 353490069873319

[rrc]
release = 15                        # Release 15 de 3GPP.
ue_category = 4                     # Categoría de UE.

[nas]
apn = srsapn                        # APN para la conexión de datos.
apn_protocol = ipv4                 # Protocolo IP.

[gw]
netns = ue1                         # Namespace de red para el UE.
ip_devname = tun_srsue              # Nombre del dispositivo TUN.
ip_netmask = 255.255.255.0          # Máscara de red.

[gui]
enable = false