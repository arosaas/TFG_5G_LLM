# ue.conf
# srsUE configuration file

[rrc]
# RRC configuration
# The following parameters are mandatory for srsUE
# and must match the gNB configuration.
mcc = 208
mnc = 93
imsi = 208930000000001 # Example IMSI, ensure it's registered in Open5GS
key = c9e8763286b5b9ff2177569700000000 # Example test key
opc = 981ca10029ee5405d06e6a865063e256 # Example test OPC
apn = internet

[nas]
# NAS configuration
# The following parameters are mandatory for srsUE
# and must match the gNB configuration.
# sst = 1 # Slice/Service Type (eMBB)
# sd = 1 # Slice Differentiator (optional)

[usim]
# USIM configuration
# The following parameters are mandatory for srsUE
# and must match the gNB configuration.
# k = 00112233445566778899AABBCCDDEEFF # Example K value (if not using key/opc)

[rf]
# RF configuration
# The following parameters are mandatory for srsUE
# and must match the gNB configuration.
device_name = softmodem # Use softmodem for ZMQ connection
gnb_addr = 10.53.1.3 # gNB IP address
gnb_port = 2000 # gNB ZMQ port (gNB listens, UE connects)

[log]
# Logging configuration
filename = /tmp/ue.log
all_level = info

[pcap]
# PCAP logging configuration
mac_enable = enable
mac_filename = /tmp/ue_mac.pcap