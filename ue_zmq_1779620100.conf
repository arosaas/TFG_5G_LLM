[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6                     # RF sample rate for 20 MHz bandwidth, matches gNB.
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6 # ZMQ ports for UE (tx to 2001, rx from 2000), crossed with gNB.

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3                           # NR Band 3, matches gNB.
nof_carriers = 1

max_nof_prb = 106                   # Max PRBs for 20 MHz bandwidth with 15 kHz SCS.
nof_prb = 106                       # Number of PRBs to use, matches gNB bandwidth.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage                     # USIM algorithm.
opc  = 63BFA50EE6523365FF14C1F45F88737D # Operator Code.
k    = 00112233445566778899aabbccddeeff # Subscriber Key.
imsi = 315010000000001              # IMSI (MCC 315, MNC 010, MSIN 000000001), matches gNB PLMN.
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn                        # Access Point Name.
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false