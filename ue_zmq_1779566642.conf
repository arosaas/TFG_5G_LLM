[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6                     # Tasa de muestreo RF coincidente con el gNB (23.04 Msps para 20 MHz).
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6 # Puertos ZMQ para el UE (TX al gNB 2000, RX del gNB 2001).

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3                           # Banda NR coincidente con el gNB.
nof_carriers = 1

max_nof_prb = 106                   # Número máximo de PRBs para 20MHz de ancho de banda, 15kHz SCS.
nof_prb = 106                       # Número de PRBs para 20MHz de ancho de banda, 15kHz SCS.

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D # OPC proporcionado en la solicitud del usuario.
k    = 00112233445566778899aabbccddeeff # K proporcionado en la solicitud del usuario.
imsi = 315010000000001              # IMSI coincidente con el PLMN (MCC 315, MNC 010) y ID de suscriptor de la solicitud.
imei = 353490069873319

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false