services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env} # Ensure this file configures MCC 208, MNC 93, TAC 7 for Open5GS
    privileged: true
    ports:
      - "9898:9999/tcp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}

  gnb:
    container_name: srsran_gnb
    image: srsran/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - gnb-storage:/tmp
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
    networks:
      ran:
        ipv4_address: ${GNB_IP:-10.53.1.3}
      metrics:
        ipv4_address: 172.19.1.3
    depends_on:
      5gc:
        condition: service_healthy
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml

configs:
  gnb_config.yml:
    content: |
      cu_cp:
        amf:
          addr: 10.53.1.2
          port: 38412
          bind_addr: 10.53.1.3
          supported_tracking_areas:
            - tac: 7
              plmn_list:
                - plmn: "20893"
                  tai_slice_support_list:
                    - sst: 1
        inactivity_timer: 7200

      ru_sdr:
        device_driver: zmq
        device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=11.52e6
        srate: 11.52
        tx_gain: 75
        rx_gain: 75

      cell_cfg:
        dl_arfcn: 368500
        band: 3
        channel_bandwidth_MHz: 10
        common_scs: 15
        plmn: "20893"
        tac: 7
        pdcch:
          common:
            ss0_index: 0
            coreset0_index: 6
          dedicated:
            ss2_type: common
            dci_format_0_1_and_1_1: false
        prach:
          prach_config_index: 1
        pdsch:
          mcs_table: qam64
        pusch:
          mcs_table: qam64

      log:
        filename: /tmp/gnb.log
        all_level: info
        hex_max_size: 0

      pcap:
        mac_enable: false
        mac_filename: /tmp/gnb_mac.pcap
        ngap_enable: false
        ngap_filename: /tmp/gnb_ngap.pcap
        e2ap_enable: true
        e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
        e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
        e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

      metrics:
        layers:
          enable_rlc: true
          enable_sched: true
        periodicity:
          du_report_period: 1000
  gnb_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: ${OPEN5GS_IP:-10.53.1.2}
          bind_addr: ${GNB_IP:-10.53.1.3}
      metrics:
        autostart_stdout_metrics: true
        enable_json: true
      remote_control:
        bind_addr: 0.0.0.0
        enabled: true

volumes:
  gnb-storage:

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24