# Configuración del gNB para LAN Party en la Universidad de Granada
# Priorizando baja latencia y mínimo retardo para gaming.

cu_cp:
  amf:
    addr: 10.53.1.2               # Dirección IP del AMF (Open5GS Core)
    port: 38412
    bind_addr: 10.53.1.3            # Dirección IP local del gNB para tráfico del AMF
    supported_tracking_areas:
      - tac: 7                      # Tracking Area Code (debe coincidir con el Core)
        plmn_list:
          - plmn: "00101"           # PLMN broadcasted por el gNB (MCC=001, MNC=01)
            tai_slice_support_list:
              - sst: 1              # Slice/Service Type 1 (eMBB, adecuado para gaming de baja latencia)
  inactivity_timer: 7200            # Temporizador de inactividad UE/PDU Session/DRB en segundos

cu_up:
  e1ap:
    cu_cp_addr: 10.53.1.3           # Dirección IP del CU-CP (gNB)
    bind_addr: 10.53.1.3            # Dirección IP local del CU-UP para tráfico E1AP
  ngu:
    socket:
      -
        bind_addr: 10.53.1.3        # Dirección IP local del CU-UP para tráfico NGU (GTP-U)
  f1u:
    socket:
      -
        bind_addr: 10.53.1.3        # Dirección IP local del CU-UP para tráfico F1U

ru_sdr:
  device_driver: zmq                # Driver RF ZMQ para simulación
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6 # Argumentos del driver ZMQ
  srate: 23.04e6                    # Tasa de muestreo RF para 20 MHz de ancho de banda
  tx_gain: 75                       # Ganancia de transmisión
  rx_gain: 75                       # Ganancia de recepción

cell_cfg:
  dl_arfcn: 620000                  # ARFCN del carrier de downlink (frecuencia central para Banda 78)
  band: 78                          # Banda NR 78 (3.3-4.2 GHz), adecuada para alta capacidad y baja latencia
  channel_bandwidth_MHz: 20         # Ancho de banda en MHz (20 MHz)
  common_scs: 15                    # Espaciado de subportadoras (SCS) en kHz para datos
  ssb_scs: 15                       # Espaciado de subportadoras (SCS) en kHz para SSB (DEBE ser igual a common_scs)
  plmn: "00101"                     # PLMN broadcasted por el gNB
  tac: 7                            # Tracking Area Code
  pdcch:
    common:
      ss0_index: 0                  # Índice de search space cero
      coreset0_index: 12            # Índice de CORESET cero (para 20 MHz)
    dedicated:
      ss2_type: common              # Tipo de Search Space
      dci_format_0_1_and_1_1: false # Formato DCI
  prach:
    prach_config_index: 1           # Índice de configuración PRACH
  pdsch:
    mcs_table: qam64                # Tabla MCS para PDSCH (64 QAM para buen rendimiento)
  pusch:
    mcs_table: qam64                # Tabla MCS para PUSCH (64 QAM para buen rendimiento)
  pucch:
    sr_period_ms: 20                # Periodo de SR en ms (20ms para baja latencia, de RAG)
    nof_cell_sr_res: 50             # Número de recursos SR por celda (de RAG, adecuado para 20MHz)
    nof_cell_csi_res: 50            # Número de recursos CSI por celda (de RAG, adecuado para 20MHz)
  csi:
    csi_rs_period: 40               # Periodo de CSI-RS en ms (de RAG)
  ul_common:
    max_ul_grants_per_slot: 64      # Máximo de UL grants por slot (de RAG)
    max_pucchs_per_slot: 63         # Máximo de PUCCHs por slot (de RAG)
  tdd_ul_dl_cfg:
    nof_dl_symbols: 7               # Número de símbolos DL (de RAG)
    nof_dl_slots: 7                 # Número de slots DL (de RAG)
    nof_ul_slots: 2                 # Número de slots UL (de RAG)

log:
  filename: /tmp/gnb.log            # Ruta del archivo de log
  all_level: info                   # Nivel de log para todas las capas
  hex_max_size: 0

pcap:
  mac_enable: true                  # Habilitar PCAPs de capa MAC
  mac_filename: /tmp/gnb_mac.pcap   # Ruta del PCAP MAC
  ngap_enable: true                 # Habilitar PCAPs de NGAP
  ngap_filename: /tmp/gnb_ngap.pcap # Ruta del PCAP NGAP
  e2ap_enable: false                # Deshabilitar PCAPs de E2AP
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

metrics:
  layers:
    enable_rlc: true                # Habilitar métricas RLC
    enable_sched: true              # Habilitar métricas del scheduler DU
  periodicity:
    du_report_period: 1000          # Periodo de reporte de estadísticas DU (1s)