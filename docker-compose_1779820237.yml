# docker-compose.yml
# Despliegue de Open5GS y srsRAN gNB en contenedores Docker.

services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    privileged: true
    ports:
      - "9898:9999/tcp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: 10.53.1.2     # IP estática para el 5GC. Coherente con gNB.

  gnb:
    container_name: srsran_gnb
    image: srsran/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - gnb-storage:/tmp
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
    networks:
      ran:
        ipv4_address: 10.53.1.3     # IP estática para el gNB. Coherente con gNB config.
      metrics:
        ipv4_address: 172.19.1.3
    depends_on:
      5gc:
        condition: service_healthy
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml

configs:
  gnb_config.yml:
    file: ./configs/gnb_zmq_lanparty.yml # Ruta al archivo de configuración del gNB generado.
  gnb_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: 10.53.1.2           # Dirección IP del AMF.
          bind_addr: 0.0.0.0        # IP local que el gNB usa para el tráfico del AMF. ESTRICTA REGLA: DEBE SER 0.0.0.0.
      metrics:
        autostart_stdout_metrics: true
        enable_json: true
      remote_control:
        bind_addr: 0.0.0.0          # Dirección de bind para control remoto. ESTRICTA REGLA: DEBE SER 0.0.0.0.
        enabled: true

volumes:
  gnb-storage:

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24