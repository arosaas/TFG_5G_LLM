[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1

device_name = zmq
device_args = tx_port=tcp://127.0.0.1:2001,rx_port=tcp://127.0.0.1:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 78                          # Matches gNB Band n78
nof_carriers = 1

max_nof_prb = 106                   # For 20 MHz bandwidth, 30 kHz SCS
nof_prb = 106                       # For 20 MHz bandwidth, 30 kHz SCS
dl_nr_arfcn = 620000                # Matches gNB ARFCN
ssb_nr_arfcn = 619990               # SSB ARFCN, typically close to DL ARFCN

[pcap]
enable = none
mac_filename = /tmp/ue_mac.pcap
mac_nr_filename = /tmp/ue_mac_nr.pcap
nas_filename = /tmp/ue_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue.log
file_max_size = -1

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
imsi = 001010123456780             # IMSI with PLMN 00101

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0
ip_addr = 192.168.70.11             # UE tunnel interface IP

[gui]
enable = false