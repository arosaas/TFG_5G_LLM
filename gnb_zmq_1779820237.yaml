# gnb_zmq_lanparty.yml
# Configuración del gNB para la LAN Party en la Universidad de Granada
# Prioriza baja latencia para gaming.

cu_cp:
  amf:
    addr: 10.53.1.2               # La dirección IP del AMF (Open5GS) en la red Docker.
    port: 38412                   # Puerto NGAP estándar.
    bind_addr: 10.53.1.3          # IP local que el gNB usa para el tráfico del AMF. ESTRICTA REGLA: DEBE SER 0.0.0.0.
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"         # PLMN (MCC+MNC) para la red de la LAN Party. Coherente con UE y Core.
            tai_slice_support_list:
              - sst: 1            # SST=1 (eMBB) para servicios generales, incluyendo gaming.
  inactivity_timer: 7200            # Aumentado para mantener sesiones de juego activas por más tiempo.

ru_sdr:
  device_driver: zmq                # Driver ZMQ para simulación de RF.
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=23.04e6 # Puertos ZMQ para TX/RX.
  srate: 23.04                      # Tasa de muestreo RF para 20 MHz de ancho de banda.
  tx_gain: 75                       # Ganancia de transmisión.
  rx_gain: 75                       # Ganancia de recepción.

cell_cfg:
  dl_arfcn: 368500                  # ARFCN para la Banda 3 (1842.5 MHz). Coherente con la banda.
  band: 3                           # Banda NR 3 (1800 MHz).
  channel_bandwidth_MHz: 20         # Ancho de banda de 20 MHz para mayor capacidad y menor latencia.
  common_scs: 15                    # Espaciado de subportadoras de 15 kHz. ESTRICTA REGLA: Debe ser igual para SSB.
  plmn: "00101"                     # PLMN broadcasted por el gNB. Coherente con AMF y UE.
  tac: 7                            # Tracking Area Code. Coherente con AMF.
  pdcch:
    common:
      ss0_index: 0                  # Índice de espacio de búsqueda cero.
      coreset0_index: 12            # Índice CORESET cero para 20MHz.
    dedicated:
      ss2_type: common              # Tipo de espacio de búsqueda.
      dci_format_0_1_and_1_1: false # Formato DCI.
  prach:
    prach_config_index: 1           # Configuración PRACH.
  pdsch:
    mcs_table: qam64                # MCS de 64 QAM para PDSCH, mayor rendimiento.
  pusch:
    mcs_table: qam64                # MCS de 64 QAM para PUSCH, mayor rendimiento.

log:
  filename: /tmp/gnb.log            # Ruta del archivo de log.
  all_level: info                   # Nivel de log.
  hex_max_size: 0

pcap:
  mac_enable: false                 # Deshabilitar PCAP MAC por defecto para reducir overhead.
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false                # Deshabilitar PCAP NGAP por defecto.
  ngap_filename: /tmp/gnb_ngap.pcap
  e2ap_enable: false                # Deshabilitar PCAP E2AP por defecto.
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

metrics:
  layers:
    enable_rlc: true                # Habilitar métricas RLC.
    enable_sched: true              # Habilitar métricas del scheduler DU.
  periodicity:
    du_report_period: 1000          # Reporte de estadísticas DU cada 1 segundo.
