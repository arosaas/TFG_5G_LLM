# docker-compose.yml
version: '3.8'

networks:
  open5gs-net:
    ipam:
      config:
        - subnet: 10.53.1.0/24

services:
  mongodb:
    container_name: mongodb
    image: mongo:4.4
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.100
    volumes:
      - ./data/db:/data/db
    restart: always

  open5gs-amf:
    container_name: open5gs-amf
    image: open5gs/open5gs:latest
    command: open5gs-amfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.2
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-smf:
    container_name: open5gs-smf
    image: open5gs/open5gs:latest
    command: open5gs-smfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.4
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-upf:
    container_name: open5gs-upf
    image: open5gs/open5gs:latest
    command: open5gs-upfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.7
    depends_on:
      - mongodb
      - open5gs-smf
    cap_add:
      - NET_ADMIN
    privileged: true
    restart: always

  open5gs-nrf:
    container_name: open5gs-nrf
    image: open5gs/open5gs:latest
    command: open5gs-nrfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.10
    depends_on:
      - mongodb
    restart: always

  open5gs-udm:
    container_name: open5gs-udm
    image: open5gs/open5gs:latest
    command: open5gs-udmd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.12
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-ausf:
    container_name: open5gs-ausf
    image: open5gs/open5gs:latest
    command: open5gs-ausfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.11
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-pcf:
    container_name: open5gs-pcf
    image: open5gs/open5gs:latest
    command: open5gs-pcfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.13
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-nssf:
    container_name: open5gs-nssf
    image: open5gs/open5gs:latest
    command: open5gs-nssfd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.14
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

  open5gs-scp:
    container_name: open5gs-scp
    image: open5gs/open5gs:latest
    command: open5gs-scpd
    volumes:
      - ./open5gs-config:/open5gs/config
    networks:
      open5gs-net:
        ipv4_address: 10.53.1.200
    depends_on:
      - mongodb
      - open5gs-nrf
    restart: always

