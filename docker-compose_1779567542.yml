services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    env_file:
      - ${OPEN_5GS_ENV_FILE:-open5gs/open5gs.env}
    privileged: true
    ports:
      - "9898:9999/tcp"
    # Uncomment port to use the 5gc from outside the docker network
#      - "38412:38412/sctp"
 #     - "2152:2152/udp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: 10.53.1.2 # Explicitly assign AMF IP as requested

  gnb:
    container_name: srsran_gnb
    # Build info
    image: srsran/gnb
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
    # privileged mode is requred only for accessing usb devices
    privileged: true
    # Extra capabilities always required
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      # Access USB to use some SDRs
      - /dev/bus/usb/:/dev/bus/usb/
      # Sharing images between the host and the pod.
      # It's also possible to download the images inside the pod
      - /usr/share/uhd/images:/usr/share/uhd/images
      # Save logs and more into gnb-storage
      - gnb-storage:/tmp
    # It creates a file/folder into /config_name inside the container
    # Its content would be the value of the file used to create the config
    configs:
      - gnb_config.yml
      - gnb_compose_config.yml
    # Customize your desired network mode.
    # current netowrk configuration creastes a private netwoek with both containers attached
    # An alterantive would be `network: host"`. That would expose your host network into the container. It's the easiest to use if the 5gc is not in your PC
    networks:
      ran:
        ipv4_address: 10.53.1.3 # Explicitly assign gNB IP as requested
      metrics:
        ipv4_address: 172.19.1.3
    # Start GNB container after 5gc is up and running
    depends_on:
      5gc:
        condition: service_healthy
    # Command to run into the final container
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml

configs:
  gnb_config.yml:
    file: ${GNB_CONFIG_PATH:-../configs/gnb_v2x.yml} # Path to the generated gNB config file
  gnb_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: 10.53.1.2 # AMF IP, matching the service definition
          bind_addr: 10.53.1.3 # gNB IP, matching the service definition
      metrics:
        autostart_stdout_metrics: true
        enable_json: true
      remote_control:
        bind_addr: 0.0.0.0
        enabled: true

volumes:
  gnb-storage:

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24

# Tutorial: ZeroMQ-based Setup for srsRAN Project (adapted for Docker)
#
# This tutorial explains how to set up and test connectivity for srsRAN Project
# gNB and UE using ZeroMQ for virtual RF, with Open5GS as the 5G Core,
# leveraging the Docker setup defined above.
#
# Prerequisites:
# - Docker and Docker Compose installed.
# - srsRAN Project source code cloned (assuming docker-compose.yml is in srsran_project/docker).
# - The generated 'gnb_v2x.yml' should be placed in 'srsran_project/configs/'.
# - The generated 'ue_v2x.conf' can be placed anywhere, as srsUE will be run outside Docker.
#
# Step 1: Prepare the srsRAN Project environment
# ----------------------------------------------
# Ensure your srsRAN Project build supports ZeroMQ. If building from source,
# navigate to your srsRAN Project root directory and build it:
#
#   cd srsran_project
#   mkdir build && cd build
#   cmake -DENABLE_ZMQ=ON ..
#   make -j$(nproc)
#   sudo make install
#   sudo srsran_install_configs.sh
#
# Step 2: Place Configuration Files
# ---------------------------------
# - Save the generated gNB configuration as `srsran_project/configs/gnb_v2x.yml`.
# - Save the generated UE configuration as `ue_v2x.conf` in a convenient location.
#
# Step 3: Start the 5G Core and gNB using Docker Compose
# ------------------------------------------------------
# Navigate to the directory containing your `docker-compose.yml` (e.g., `srsran_project/docker`).
#
#   cd srsran_project/docker
#   docker-compose up -d 5gc gnb
#
# This command will:
# - Build and start the Open5GS 5GC container (`open5gs_5gc`).
# - Build and start the srsRAN gNB container (`srsran_gnb`).
# - The gNB container will wait for the 5GC to be healthy before starting.
# - The gNB will load `gnb_v2x.yml` and the compose-specific overrides.
#
# You can check the logs of the running containers:
#   docker-compose logs -f 5gc
#   docker-compose logs -f gnb
#
# Step 4: Run the srsUE
# ---------------------
# Open a new terminal. The srsUE will run directly on your host machine,
# connecting to the gNB's ZMQ interface.
#
#   sudo srsue -c /path/to/your/ue_v2x.conf
#
# Replace `/path/to/your/ue_v2x.conf` with the actual path to your UE configuration file.
#
# Step 5: Verify Connectivity
# ---------------------------
# Once the srsUE starts, observe its logs and the gNB logs (from the Docker terminal).
#
# Expected log messages:
# - In gNB logs: Look for "RRC Setup Complete", "PDU Session Establishment Request", "PDU Session Establishment Accept".
# - In UE logs: Look for "RRC Connected", "PDU Session Established".
#
# After successful connection, the UE should have an IP address assigned. You can verify this
# and test internet connectivity from the UE's network namespace:
#
#   sudo ip netns exec ue1 ip a
#   sudo ip netns exec ue1 ping -I tun_srsue 8.8.8.8
#
# This will send ICMP requests from the UE's tunnel interface (`tun_srsue`) within its
# dedicated network namespace (`ue1`) to an external IP (e.g., Google's DNS).
# Successful pings indicate end-to-end connectivity through the 5G network.
#
# Step 6: Clean up (Optional)
# ---------------------------
# To stop and remove the Docker containers:
#   cd srsran_project/docker
#   docker-compose down
#
# To stop the srsUE, press Ctrl+C in its terminal.